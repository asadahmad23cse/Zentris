services:
  nginx:
    image: nginx:1.27-alpine
    container_name: zentris_nginx
    depends_on:
      gateway:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: zentris_gateway
    environment:
      NODE_ENV: production
      ZENTRIS_STRICT_CONFIG: "true"
      ZENTRIS_DEMO_ENABLED: "${ZENTRIS_DEMO_ENABLED:-false}"
      PORT: "3000"
      REDIS_URL: "redis://redis:6379/0"
      LITELLM_BASE_URL: "http://litellm:4000/v1"
      LITELLM_API_KEY: "${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}"
      LITELLM_MODEL: "${LITELLM_MODEL:-gpt-4o-mini}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      CONFIRMATION_TOKEN_SECRET: "${CONFIRMATION_TOKEN_SECRET:?set CONFIRMATION_TOKEN_SECRET}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-120}"
      RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-1 minute}"
      REQUEST_BODY_LIMIT_BYTES: "${REQUEST_BODY_LIMIT_BYTES:-1048576}"
      STREAMING_CONCURRENT_LIMIT: "${STREAMING_CONCURRENT_LIMIT:-2}"
      STREAMING_SLOT_TTL_SECONDS: "${STREAMING_SLOT_TTL_SECONDS:-120}"
      STREAMING_ROLLING_BUFFER_CHARS: "${STREAMING_ROLLING_BUFFER_CHARS:-256}"
      STREAMING_SUSPICIOUS_EVENT_LIMIT: "${STREAMING_SUSPICIOUS_EVENT_LIMIT:-3}"
      STREAMING_SESSION_SUSPICIOUS_EVENT_LIMIT: "${STREAMING_SESSION_SUSPICIOUS_EVENT_LIMIT:-10}"
      STREAMING_SESSION_SUSPICIOUS_WINDOW_SECONDS: "${STREAMING_SESSION_SUSPICIOUS_WINDOW_SECONDS:-900}"
      PUBLIC_WEB_ORIGIN: "${PUBLIC_WEB_ORIGIN:-http://localhost}"
    depends_on:
      litellm:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  litellm:
    build:
      context: .
      args:
        target: runtime
    image: zentris-litellm:local
    container_name: zentris_litellm
    command: ["--config=/app/proxy_server_config.production.yaml", "--port", "4000"]
    expose:
      - "4000"
    environment:
      DATABASE_URL: "postgresql://llmproxy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/litellm"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}"
      STORE_MODEL_IN_DB: "True"
      ENFORCE_PRISMA_MIGRATION_CHECK: "true"
      REDIS_URL: "redis://redis:6379/0"
      UI_USERNAME: "${UI_USERNAME:-admin}"
      UI_PASSWORD: "${UI_PASSWORD:?set UI_PASSWORD}"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  telemetry-worker:
    image: zentris-litellm:local
    container_name: zentris_telemetry_worker
    entrypoint: ["python"]
    command: ["-m", "zentris_security.telemetry_worker"]
    environment:
      DATABASE_URL: "postgresql://llmproxy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/litellm"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      litellm:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: zentris_dashboard
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_USE_REWRITES: "false"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zentris_redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: zentris_grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  prometheus_data:
  postgres_data:
    name: litellm_postgres_data
  redis_data:
  grafana_data:
