services:
  - type: web
    name: zentris-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZENTRIS_DEMO_ENABLED
        value: "true"
      - key: PORT
        value: "10000"
      - key: REDIS_URL
        sync: false
      - key: LITELLM_BASE_URL
        sync: false
      - key: LITELLM_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CONFIRMATION_TOKEN_SECRET
        sync: false
