name: Zentris Production Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  production-gate:
    name: Build, Test, and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REDIS_URL: redis://localhost:6379
      LITELLM_BASE_URL: http://localhost:4000
      LITELLM_API_KEY: sk-ci-test-key
      JWT_SECRET: ci-jwt-secret-12345678901234567890
      CONFIRMATION_TOKEN_SECRET: ci-confirmation-secret-12345678901234567890
      LOG_LEVEL: info
      PORT: "3100"
      POSTGRES_PASSWORD: ci-postgres-password
      LITELLM_MASTER_KEY: ci-master-key
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install root dependencies
        run: npm ci

      - name: Build root middleware
        run: npm run build

      - name: Test root middleware
        run: npm test

      - name: Install Python test dependencies
        run: python -m pip install -e ".[proxy]" pytest pyyaml

      - name: Run Zentris Python security tests
        run: |
          python -m pytest \
            tests/test_zentris_security_pipeline.py \
            tests/test_zentris_security_detectors.py \
            tests/test_zentris_security_audit_simulator.py \
            tests/test_prompt_injection_detection.py \
            tests/test_litellm_proxy_responses_config.py \
            -q

      - name: Validate deployment config
        run: |
          python -c "import yaml; yaml.safe_load(open('proxy_server_config.yaml', encoding='utf-8'))"
          cp .env.production.example .env
          docker compose -f docker-compose.yml config --quiet

      - name: Install dashboard dependencies
        working-directory: ui/litellm-dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: ui/litellm-dashboard
        run: npm run build
